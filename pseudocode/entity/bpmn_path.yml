items:
  - name: BpmnPath
    type: class
    description: "One way through a process, start to end: its steps, who does each, and the\nchoices taken at each fork — a scenario.\nRead from the `.bpmn` files of the registry, never stored: no `#[ORM\\Entity]`.\nIts id derives from what identifies it, so a list read twice holds the same\nentities."
    properties:
      - name: id
        type: Symfony\Component\Uid\Uuid
      - name: processId
        type: string
      - name: position
        type: int
      - name: complete
        type: bool
      - name: nodeIds
        type: array
      - name: steps
        type: array
      - name: choices
        type: array
      - name: description
        type: string
    methods:
      - type: method
        name: buildEntityPath
        parameters:
          - type: string
            name: className
        return:
          type: string
      - type: method
        name: getEntityKeyName
        return:
          type: string
      - type: method
        name: getEntityShortName
        return:
          type: string
      - type: method
        name: getId
        return:
          type: Symfony\Component\Uid\Uuid
      - type: method
        name: setId
        parameters:
          - type: Symfony\Component\Uid\Uuid
            name: id
        return:
          type: void
      - type: method
        name: getTableizedName
        return:
          type: string
      - type: method
        name: getCamelName
        return:
          type: string
      - type: method
        name: __construct
        parameters:
          - type: string
            name: processId
          - type: int
            name: position
          - type: bool
            name: complete
          - type: array
            name: nodeIds
          - type: array
            name: steps
          - type: array
            name: choices
          - type: string
            name: description
      - type: method
        name: getProcessId
        return:
          type: string
      - type: method
        name: getPosition
        return:
          type: int
      - type: method
        name: getComplete
        return:
          type: bool
      - type: method
        name: getNodeIds
        return:
          type: array
      - type: method
        name: getSteps
        return:
          type: array
      - type: method
        name: getChoices
        return:
          type: array
      - type: method
        name: getDescription
        return:
          type: string
