services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyBpmn\:
        resource: '../../{Command,EventSubscriber,MessageHandler,Service}'
        exclude:
            - '../../Command/Abstract*.php'
            # Registered by the extension, when what they feed is installed.
            - '../../EventSubscriber/BpmnActivitySubscriber.php'
            - '../../EventSubscriber/BpmnNotificationSubscriber.php'

    Wexample\SymfonyBpmn\Interface\BpmnTimerSchedulerInterface:
        alias: Wexample\SymfonyBpmn\Service\MessengerTimerScheduler
